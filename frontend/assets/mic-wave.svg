<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Sound waves animated -->
  <g class="sound-waves" opacity="0">
    <circle cx="50" cy="50" r="25" stroke="#00A6ED" stroke-width="2" fill="none" stroke-dasharray="6 2">
      <animate attributeName="r" from="25" to="45" dur="2s" begin="0s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0.7" to="0" dur="2s" begin="0s" repeatCount="indefinite" />
    </circle>
    <circle cx="50" cy="50" r="25" stroke="#00A6ED" stroke-width="2" fill="none" stroke-dasharray="6 2">
      <animate attributeName="r" from="25" to="45" dur="2s" begin="0.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0.7" to="0" dur="2s" begin="0.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="50" cy="50" r="25" stroke="#00A6ED" stroke-width="2" fill="none" stroke-dasharray="6 2">
      <animate attributeName="r" from="25" to="45" dur="2s" begin="0.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0.7" to="0" dur="2s" begin="0.6s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Microphone body -->
  <g class="microphone" filter="url(#glow)">
    <rect x="40" y="30" width="20" height="35" rx="10" fill="#00A6ED" />
    <rect x="40" y="30" width="20" height="35" rx="10" fill="url(#gradient)" />
    <path d="M30 50C30 55.5228 34.4772 60 40 60H60C65.5228 60 70 55.5228 70 50" stroke="white" stroke-width="3" stroke-linecap="round" />
    <line x1="50" y1="65" x2="50" y2="75" stroke="white" stroke-width="3" stroke-linecap="round" />
    <line x1="40" y1="75" x2="60" y2="75" stroke="white" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="50" y1="30" x2="50" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00A6ED" />
      <stop offset="1" stop-color="#0077C2" />
    </linearGradient>
  </defs>
  
  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .microphone {
      animation: pulse 2s ease-in-out infinite;
      transform-origin: center;
    }
    
    .sound-waves {
      opacity: 0;
    }
    
    .sound-waves.active {
      opacity: 1;
    }
  </style>
  
  <script>
    // This script will be executed when the SVG is embedded inline
    function activateWaves() {
      const waves = document.querySelector('.sound-waves');
      waves.classList.add('active');
    }
    
    function deactivateWaves() {
      const waves = document.querySelector('.sound-waves');
      waves.classList.remove('active');
    }
  </script>
</svg> 