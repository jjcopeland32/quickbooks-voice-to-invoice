services:
  mongodb:
    image: mongo:6.0
    container_name: qb-voice-invoice-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=quickbooks-voice-invoice
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qb-voice-invoice-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/quickbooks-voice-invoice
      - FRONTEND_URL=http://localhost:8081
      - CORS_ORIGIN=http://localhost:8081
      - JWT_SECRET=dev_jwt_secret_key_for_local_development_only
      - JWT_EXPIRES_IN=24h
      - ENCRYPTION_KEY=00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      - QB_ENVIRONMENT=sandbox
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
    depends_on:
      - mongodb
    networks:
      - app-network
    command: npm run dev

  frontend:
    image: nginx:alpine
    container_name: qb-voice-invoice-frontend
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data: 